name: Release

# Changesets' trusted-publishing workflow (changesets.dev/guide/automating),
# on pnpm. With changesets on main, the version job opens or updates the
# "Version Packages" pull request. Once that is merged, pack builds, checks
# and packs menhir, and publish sends the tarball to npm.

on:
  push:
    branches: [main]

# Each job asks for what it needs; only publish can mint an npm token.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version Packages pull request
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      # A pull request opened with the workflow's token does not trigger CI.
      # Before merging, run the CI workflow on its branch from the Actions tab
      # (ci.yml has a workflow_dispatch trigger for this).
      - uses: changesets/action/version@v2

  pack:
    name: Build and pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      # Builds dist, then runs publint and @arethetypeswrong/cli on the tarball.
      - run: pnpm --filter menhir check:package
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    # The npm trusted publisher for menhir names this workflow and environment.
    # Required reviewers on the environment would gate every publish.
    environment: npm
    permissions:
      contents: write # git tags and GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
